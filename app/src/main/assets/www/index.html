<!DOCTYPE html>
<html lang="en" data-appearance="dark" data-colorway="pulse">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Atlas</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/backgrounds.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/notifications.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/nowPlaying.css">
<link rel="stylesheet" href="css/lyrics.css">
</head>
<body>
<div id="app">

  <!-- populated by js/wavesBg.js (layered animated wave gradient, colorway-driven) -->
  <div id="bg-root"></div>

  <div id="auth-root"></div>

  <div id="shell-root" hidden>
    <header id="global-header" class="glass glass--strong">
      <div class="header-top-row">
        <div class="page-title" id="page-title">Library</div>
        <div class="header-utility-icons">
          <button class="icon-btn" id="btn-notifications" style="position:relative;">
            <svg viewBox="0 0 24 24" fill="none"><path d="M6 10a6 6 0 1112 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 20a2 2 0 004 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span id="header-badge" class="header-badge" hidden></span>
          </button>
        </div>
      </div>
      <div class="header-stats">
        <button class="header-nav-btn" id="btn-discover" data-icon="discover">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Discover</span>
        </button>
        <button class="header-nav-btn" id="btn-queue" data-icon="queue">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h10M4 18h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>Queue</span>
        </button>
      </div>
    </header>

    <div id="page-container">
      <div id="page-viewport"></div>
    </div>

    <div id="mini-player" class="glass glass--strong"></div>

    <nav id="bottom-nav" class="glass glass--strong"></nav>

    <div id="indexed-pages"></div>
  </div>

  <div id="notification-root"></div>

</div>

<script src="js/wavesBg.js"></script>
<script src="js/bridge.js"></script>
<script src="js/overlay.js"></script>
<script src="js/glassDropdown.js"></script>
<script src="js/albumColor.js"></script>
<script src="js/updateFlow.js"></script>
<script src="js/store.js"></script>
<script src="js/router.js"></script>
<script src="js/notifications.js"></script>
<script src="js/icons.js"></script>
<script src="js/screens/auth.js"></script>
<script src="js/screens/library.js"></script>
<script src="js/screens/playlists.js"></script>
<script src="js/screens/settings.js"></script>
<script src="js/screens/account.js"></script>
<script src="js/screens/discover.js"></script>
<script src="js/screens/queue.js"></script>
<script src="js/screens/notificationCenter.js"></script>
<script src="js/screens/equalizer.js"></script>
<script src="js/screens/voiceIsolation.js"></script>
<script src="js/screens/lyrics.js"></script>
<script src="js/screens/nowPlaying.js"></script>
<script src="js/app.js"></script>
</body>
</html>
